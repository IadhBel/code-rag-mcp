spring:
  application:
    name: code-rag-indexer
  main:
    # No HTTP surface at all: this is a batch job.
    web-application-type: none
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # A batch job needs one connection. Keeping the pool small matters because
      # Cloud SQL counts connections per instance across every job execution that
      # happens to run concurrently.
      maximum-pool-size: 3
      connection-timeout: 30s
  flyway:
    # The indexer owns the schema. The MCP server never migrates.
    enabled: true
    locations: classpath:db/migration
    # vector_dimension is supplied programmatically -- see IndexerConfig.

coderag:
  embedding:
    provider: ${EMBEDDING_PROVIDER:VERTEX}
    # 768 keeps HNSW comfortable and cuts storage roughly fourfold against the
    # model's native 3072, at a small recall cost. Changing this invalidates every
    # stored vector.
    dimension: ${EMBEDDING_DIMENSION:768}
    vertex:
      project: ${GCP_PROJECT:}
      location: ${GCP_LOCATION:europe-west1}
      model: ${EMBEDDING_MODEL:gemini-embedding-001}
      # The document side of the asymmetric pair. The MCP server configures
      # RETRIEVAL_QUERY for the other side; using one type for both measurably
      # degrades ranking. Request batching is LangChain4j's job, so there is no
      # batch size to tune here.
      task-type: ${EMBEDDING_DOC_TASK:RETRIEVAL_DOCUMENT}
      max-retries: 3

  job:
    # Supplied per execution by the pipeline via --update-env-vars. No defaults:
    # a mistyped variable must fail the job rather than index the wrong thing.
    repo-slug: ${REPO_SLUG:}
    clone-url: ${REPO_URL:}
    branch: ${REPO_BRANCH:}
    commit-sha: ${COMMIT_SHA:}
    git-username: ${GIT_USERNAME:x-access-token}
    git-token: ${GIT_TOKEN:}
    prune-deleted: ${PRUNE_DELETED:true}
    max-file-bytes: ${MAX_FILE_BYTES:524288}
    git-timeout: ${GIT_TIMEOUT:10m}

logging:
  level:
    com.acme.coderag: INFO
  pattern:
    # Cloud Logging parses the message; keep it single-line and structured enough
    # to grep by repo slug.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
